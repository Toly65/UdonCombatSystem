name: Build Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  packageName: "com.toly65.udon-combat-system"
  listingRepo: "Toly65/vpm-listing"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version and changelog notes
        run: |
          version=$(jq -r .version package.json)
          echo "version=$version" >> $GITHUB_ENV
          echo "zipFile=${packageName}-${version}.zip" >> $GITHUB_ENV
          # notes = the "## [version]" section of CHANGELOG.md, up to the next "## ["
          awk -v v="$version" '
            /^## \[/ { if (on) exit; on = index($0, "[" v "]") }
            on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No '## [$version]' section in CHANGELOG.md"; exit 1
          fi

      - name: Create Zip
        run: zip -r "$zipFile" . -x '*.git*' '.github/*' notes.md

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$version" "$zipFile" package.json \
            --title "$version" --notes-file notes.md

      - name: Rebuild VPM listing
        env:
          GH_TOKEN: ${{ secrets.LISTING_PAT }}
        run: gh workflow run build-listing.yml --repo "$listingRepo"
